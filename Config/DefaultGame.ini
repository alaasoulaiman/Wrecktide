; UWrecktideDataSubsystem::LoadCsvTable reads Content/Data/*.csv from disk at runtime. Nothing cooks a
; loose CSV, so without this rule a packaged build ships EMPTY tables (every shop offer "unavailable",
; kills award nothing, silently). Staging the folder as UFS puts the files in the pak where
; FFileHelper::LoadFileToString finds them under FPaths::ProjectContentDir(). Verified by the first
; package run, not by the editor, which never needed it.
+DirectoriesToAlwaysStageAsUFS=(Path="Data")
; Enemies.csv names its Synty skins by soft path (FEnemyTableRow::SkinMesh); only the Deckhand and
; the Captain are referenced by an asset, so the cooker would drop every other skin without this.
+DirectoriesToAlwaysCook=(Path="/Game/PolygonPirates/Meshes/CharactersUE4Mannequin")
+DirectoriesToAlwaysCook=(Path="/Game/Audio/SFX")
; Player pistols, enemy rifles and their shared aim pose are loaded from C++/CSV paths.
+DirectoriesToAlwaysCook=(Path="/Game/PolygonPirates/Meshes/Weapons")
+DirectoriesToAlwaysCook=(Path="/Game/Characters/Mannequins/Anims/Pistol")
; Musketeers use the existing rifle aim pose; its string reference must survive cooking.
+DirectoriesToAlwaysCook=(Path="/Game/Characters/Mannequins/Anims/Rifle")
; The wardrobe colourways are the twelve MI_PolygonPirates_XX_Y instances, referenced only by string from C++, so the
; cooker dropped eleven of them from the first beta package (WRECKTIDE-WARDROBE loaded variants=1). Cook the folder.
+DirectoriesToAlwaysCook=(Path="/Game/PolygonPirates/Materials")
; The Slate menu loads /Game/UI/Textures/* with LoadObject at runtime, so nothing references them
; from an asset and the cooker would drop every one (a packaged build would show a flat panel).
+DirectoriesToAlwaysCook=(Path="/Game/UI")
; The menu fonts are TTF FILES read by path (FSlateFontInfo takes a filename, not a UFont asset).
; Without this the pak has no font file and the panel falls back to the engine's own face.
+DirectoriesToAlwaysStageAsUFS=(Path="UI/Fonts")
; The ocean's underwater post process material lives in the Water PLUGIN's content
; (/Water/Materials/PostProcessing). The water body component references it, so the cooker should
; follow that reference, but the same slot is also reachable by string and a plugin content folder
; outside /Game is exactly what gets dropped: an unreferenced post process material comes back null
; in a cooked build while working fine in the editor. Cook the folder and the packaged swim keeps
; its underwater tint.
+DirectoriesToAlwaysCook=(Path="/Water/Materials/PostProcessing")
