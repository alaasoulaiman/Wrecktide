[/Script/NavigationSystem.RecastNavMesh]
; 2026-09-04: the island is static and the level now ships an editor-built navmesh (Tools\island_navbounds.py pumps the
; build headless); Dynamic rebuilt everything at load and left the field and hill without tiles for the first ~20 s.
RuntimeGeneration=DynamicModifiersOnly
; 2026-09-04: the island tiers step 40 uu (beach -40, field 0, hill +40) and the default agent step of 35 left
; them as separate nav islands, so enemies could not chase onto the beach or up to the fort. 45 still left the hill
; disconnected (Recast climb = floor(45 / cellH 10) = 4 cells and the +40 hill top rounds to 5), so 55 = 5 cells.
AgentMaxStepHeight=55
; 5.6 reads the step height per resolution (the scalar above is deprecated and only migrates old data). Low / Default /
; High keep the engine cell sizes (38 / 19 / 9.5) and get the 55 uu climb (audit 2026-09-04).
NavMeshResolutionParams[0]=(CellSize=38.000000,CellHeight=10.000000,AgentMaxStepHeight=55.000000)
NavMeshResolutionParams[1]=(CellSize=19.000000,CellHeight=10.000000,AgentMaxStepHeight=55.000000)
NavMeshResolutionParams[2]=(CellSize=9.500000,CellHeight=10.000000,AgentMaxStepHeight=55.000000)
; the 15200 uu bounds need ~2312 tiles; the runtime pool defaulted to 2048, so the dynamic rebuild left the field and
; hill without tiles (only the beach projected onto the navmesh). Fixed pool with headroom.
bFixedTilePoolSize=True
TilePoolSize=4096
