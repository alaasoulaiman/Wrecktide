[/Script/Engine.RendererSettings]
; Potato mode for the integrated-GPU dev box (set on the T480s, which is RETIRED; the Dell 3551 is
; the baseline now and these settings have not been re-measured on it). Re-measure before relaxing
; anything here: Lumen GI/reflections off, virtual shadow maps off, FXAA instead of TSR.
; Distance fields stay on (Water shoreline needs them later).
r.ReflectionMethod=2
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=0
r.Shadow.Virtual.Enable=0
r.AntiAliasingMethod=1
r.Lumen.TraceMeshSDFs=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=true
r.AllowStaticLighting=False

; Water plugin console variables (2026-09-06, complaint C5 "I can't even see the water when I am
; swimming in it"). These are plain console variables, not RendererSettings UPROPERTYs, so they
; belong in [SystemSettings] rather than the block above; the plugin ships with NO project config
; at all, which is why every one of them was on its engine default.
;
; UnderwaterFogWhenCameraIsAboveWater: the underwater post process is CAMERA driven, not capsule
; driven (UWaterSubsystem::ComputeUnderwaterPostProcess sweeps from the VIEW location and computes
; immersion as WaterPlaneZ - ViewZ), so a boom camera a metre above the surface can never trigger
; it however deep the pirate swims. With this on, the volume fogs through the surface from a dry
; camera, which is the only way a third person swimmer sees the water he is in.
; EnableUnderwaterPostProcess is ECVF_Scalability, so a low scalability bucket can silently switch
; the effect off in a packaged build with nothing else changed. Pin it.
; The family really is r.Water.SingleLayer.*; only .SupportCloudShadow uses the longer name.
[SystemSettings]
r.Water.SingleLayer.UnderwaterFogWhenCameraIsAboveWater=1
r.Water.EnableUnderwaterPostProcess=1
; MEASURED OFF, 2026-09-06 round 2. This is complaint C5's actual cause. On a near mirror surface at
; a grazing angle the single layer water reflection is almost the entire visible signal, and with
; FXAA there is no temporal history to steady it, so it smeared the beach, the rocks and the pirate
; into tall vertical streaks down the whole near surface (_logs\look_sea_r2base_view1.png). Off, the
; surface falls back to the sky light cubemap and reads as deep blue water with a clean horizon
; (_logs\look_sea_r2noreflect_view1.png); water_measure detail 0.0064 -> 0.0116 and stddev
; 0.113 -> 0.158 in the same shot. Revisit if a temporal AA method is ever turned back on.
r.Water.SingleLayer.Reflection=0
; FXAA gives screen space reflections no temporal history, which is what made the sea read as a
; blocky mirror of the sand in the beta captures. Raising SSR quality costs nothing on a surface
; this size and steadies the highlight the new waves catch.
r.SSR.Quality=3

; The sky light is the ONLY fill light in this level (r.DynamicGlobalIlluminationMethod=0 means no
; bounce at all), so if its real time capture is switched off or time sliced away, every shadowed
; surface goes black however high Intensity is set. Pin the capture on and take it in one frame
; rather than spread over several, which is what left a half built cubemap on screen.
r.SkyLight.RealTimeReflectionCapture=1
r.SkyLight.RealTimeReflectionCapture.TimeSlice=0

; Stop the Water plugin drawing its own surface. AWrecktideSeaSurface draws the sea instead: the
; plugin mesh tears into a picket fence at a grazing angle because its near-camera tiles are
; stretched into vertical slivers and Gerstner displacement lifts each sliver's near vertex
; (_logs\look_sea_r3mesh_view1.png at TessellationFactor 10 is the proof that more tessellation
; does not fix it). The ocean actor, the water zone, the water info texture, the underwater post
; process and the sea APhysicsVolume all stay exactly as they were: this hides a MESH, not water.
r.Water.WaterMesh.Enabled=0

; GAS anim system reads these data-driven cvars at runtime (root-bone offset radius, thread-safe
; anim update, new gameplay camera, motion-matching LOD). Copied verbatim from the Game Animation
; Sample; renderer-independent so potato mode is unaffected. Phase 2 prerequisite (verify #4).
